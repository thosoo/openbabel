name: CIFuzz
on: [pull_request]
jobs:
  Fuzzing:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Build Fuzzers
      id: build
      env:
        GITHUB_ACTIONS: "false"
        CI: "false"
        GITHUB_REF: ${{ github.event.pull_request.head.sha }}
      uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@master
      with:
        oss-fuzz-project-name: 'openbabel'
        project-src-path: '${{ github.workspace }}'
        dry-run: false
        language: c++
    - name: Run Fuzzers
      env:
        GITHUB_ACTIONS: "false"
        CI: "false"
        GITHUB_REF: ${{ github.event.pull_request.head.sha }}
      uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@master
      with:
        oss-fuzz-project-name: 'openbabel'
        project-src-path: '${{ github.workspace }}'
        fuzz-seconds: 300
        dry-run: false
        language: c++
    - name: Upload Crash
      uses: actions/upload-artifact@v4
      if: failure() && steps.build.outcome == 'success'
      with:
        name: artifacts
        path: ./out/artifacts
